<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Motion Levels Floor Controller</title>
  <style>
    :root { color-scheme: dark; font-family: Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; background:#05070a; color:#f4f7fb }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; overflow:hidden; background:#05070a }
    main { width:100vw; height:100vh; display:grid; place-items:center }
    .chrome { position:fixed; inset:10px 10px auto; z-index:2; display:flex; justify-content:flex-end; align-items:center; gap:8px; pointer-events:none }
    .telemetry,.group,button.icon { height:30px; border:1px solid rgba(255,255,255,.13); border-radius:7px; background:rgba(7,10,15,.72); backdrop-filter:blur(9px) }
    .telemetry { display:flex; align-items:center; gap:8px; min-width:0; padding:0 11px }
    #status { width:8px; height:8px; border-radius:50%; background:#64748b }
    #status.live { background:#36d66b; box-shadow:0 0 10px rgba(54,214,107,.8) }
    #status.error { background:#ff5c5c; box-shadow:0 0 10px rgba(255,92,92,.75) }
    #config { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgba(244,247,251,.75); font:600 10px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase }
    .controls,.group { display:flex; align-items:center; gap:3px; pointer-events:auto }
    .group { padding:3px }
    button { border:1px solid transparent; border-radius:4px; color:rgba(244,247,251,.72); background:transparent; cursor:pointer; font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace }
    button.mode { height:22px; padding:0 8px }
    button:hover:not(:disabled) { color:#fff; background:rgba(255,255,255,.08) }
    button.active { color:#36d66b; border-color:rgba(54,214,107,.45); background:rgba(54,214,107,.18) }
    button.window.active { color:#60a5fa; border-color:rgba(96,165,250,.45); background:rgba(59,130,246,.22) }
    button.danger:hover { color:#f87171; border-color:rgba(248,113,113,.45); background:rgba(239,68,68,.18) }
    button:disabled { display:none }
    button.icon { width:30px; padding:0; display:grid; place-items:center }
    button:focus-visible { outline:2px solid #fff; outline-offset:2px }
    #board { --cols:32; --rows:16; --aspect:2; position:relative; display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); grid-template-rows:repeat(var(--rows),minmax(0,1fr)); gap:2px; aspect-ratio:var(--aspect); width:min(98vw,calc(98vh * var(--aspect))); height:min(98vh,calc(98vw / var(--aspect))); touch-action:none; user-select:none }
    .tile { position:relative; display:grid; place-items:center; min-width:0; min-height:0; background:#111827; color:rgba(255,255,255,.8); font:600 8px/1 ui-monospace,monospace }
    .tile.pressed { box-shadow:inset 0 0 0 3px #ff3030,0 0 10px rgba(255,48,48,.7) }
    .label { display:none; pointer-events:none }
    #board.stats .label,#board.channels .label { display:block }
    @media (max-width:800px) { .chrome { inset:6px 6px auto; flex-wrap:wrap } .telemetry { max-width:100% } button.mode { padding:0 6px } }
  </style>
</head>
<body>
<main>
  <div class="chrome">
    <div class="telemetry"><span id="status" aria-label="Connection status"></span><span id="config"></span></div>
    <div class="controls">
      <div class="group" aria-label="View mode">
        <button class="mode active" data-mode="live">Live</button><button class="mode" data-mode="steps">Steps</button><button class="mode" data-mode="dwell">Dwell</button><button class="mode" data-mode="channels">Channels</button>
      </div>
      <div class="group" aria-label="Statistics window">
        <button class="mode window active" data-window="5">5m</button><button class="mode window" data-window="15">15m</button><button class="mode window" data-window="0">All</button><button id="reset" class="mode danger" disabled>Reset</button>
      </div>
      <button id="fullscreen" class="icon" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
    </div>
  </div>
  <div id="board" aria-label="LED floor preview"></div>
</main>
<script>
  const width=16,height=32,tileCount=width*height;
  const board=document.querySelector('#board'),statusEl=document.querySelector('#status'),configEl=document.querySelector('#config'),resetButton=document.querySelector('#reset');
  const tiles=new Map(),activePointers=new Map();
  let mode='live',windowMinutes=5,eventSource=null,state=null,pressure=new Uint8Array(64),rgb=new Uint8Array(tileCount*3),stats=[];
  const channelColors=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];

  for(let y=0;y<height;y++) for(let x=0;x<width;x++){
    const tile=document.createElement('div'); tile.className='tile'; tile.dataset.key=`${x},${y}`;
    const label=document.createElement('span'); label.className='label'; tile.append(label); board.append(tile); tiles.set(tile.dataset.key,tile);
  }

  function orient(){
    const landscape=innerWidth>=innerHeight,cols=landscape?height:width,rows=landscape?width:height;
    board.style.setProperty('--cols',cols); board.style.setProperty('--rows',rows); board.style.setProperty('--aspect',cols/rows);
    for(const tile of tiles.values()){ const [x,y]=tile.dataset.key.split(',').map(Number); tile.style.gridColumn=(landscape?y:x)+1; tile.style.gridRow=(landscape?x:y)+1; }
  }
  function channelFor(x,y){ const wireY=state?.floor_rotation===180?height-1-y:y; return 7-Math.floor(wireY/4); }
  function render(){
    let maxSteps=1,maxDwell=1; for(const item of stats){ maxSteps=Math.max(maxSteps,item.presses||0); maxDwell=Math.max(maxDwell,item.duration||0); }
    const scale=1-Math.min(1,Math.max(0,state?.fade_ratio??1));
    for(let y=0;y<height;y++) for(let x=0;x<width;x++){
      const index=y*width+x,tile=tiles.get(`${x},${y}`),label=tile.querySelector('.label');
      tile.classList.toggle('pressed',Boolean(pressure[index>>3]&(1<<(index&7))));
      if(mode==='live'){
        const offset=index*3; tile.style.backgroundColor=`rgb(${Math.round(rgb[offset]*scale)},${Math.round(rgb[offset+1]*scale)},${Math.round(rgb[offset+2]*scale)})`; label.textContent='';
      }else if(mode==='steps'){
        const value=stats[index]?.presses||0,ratio=value/maxSteps; tile.style.backgroundColor=value?`rgba(239,68,68,${.15+ratio*.85})`:'#111827'; label.textContent=value||'';
      }else if(mode==='dwell'){
        const value=stats[index]?.duration||0,ratio=value/maxDwell; tile.style.backgroundColor=value?`rgba(59,130,246,${.15+ratio*.85})`:'#111827'; label.textContent=value?`${value.toFixed(1)}s`:'';
      }else{
        const channel=channelFor(x,y); tile.style.backgroundColor=channelColors[channel]; label.textContent=`CH${channel}`;
      }
    }
  }
  function decodeBase64(value,target){ target.fill(0); if(!value)return; const raw=atob(value); for(let i=0;i<Math.min(raw.length,target.length);i++)target[i]=raw.charCodeAt(i); }
  function update(next){
    state=next; if(Array.isArray(next.tile_stats))stats=next.tile_stats;
    decodeBase64(next.pressure_base64,pressure); decodeBase64(next.rgb_base64,rgb);
    statusEl.className=next.engine_connected?'live':'';
    const fps=Number.isFinite(next.fps)?next.fps.toFixed(0):'0';
    configEl.textContent=[`${fps}/${next.configured_fps} FPS`,`ENGINE ${next.engine_connected?'ONLINE':'WAITING'}`,`UDP ${String(next.udp_write).toUpperCase()}`,`FLOOR ${next.floor_seen?'ACTIVE':'NO LINK'}`,`ACTIVE ${next.active_pressed_tiles}/${tileCount}`].join(' · ');
    resetButton.disabled=!next.debug_controls_enabled; render();
  }
  async function fetchState(){ try{ const response=await fetch(`/state?window=${windowMinutes}`,{cache:'no-store'}); if(response.ok)update(await response.json()); }catch{} }
  function connect(){
    eventSource?.close(); eventSource=new EventSource(`/events?window=${windowMinutes}`);
    eventSource.onopen=()=>statusEl.className=state?.engine_connected?'live':'';
    eventSource.onerror=()=>{ statusEl.className='error'; fetchState(); };
    eventSource.addEventListener('state',event=>{ try{update(JSON.parse(event.data));}catch{} });
  }
  function setMode(next){ mode=next; document.querySelectorAll('[data-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mode===next)); board.className=next==='channels'?'channels':next==='steps'||next==='dwell'?'stats':''; render(); }
  function setWindow(next){ windowMinutes=next; document.querySelectorAll('[data-window]').forEach(button=>button.classList.toggle('active',Number(button.dataset.window)===next)); connect(); fetchState(); }
  document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>setMode(button.dataset.mode));
  document.querySelectorAll('[data-window]').forEach(button=>button.onclick=()=>setWindow(Number(button.dataset.window)));
  resetButton.onclick=async()=>{ if(!confirm('Reset local in-memory step and dwell statistics?'))return; await fetch('/stats/reset',{method:'POST',headers:{'X-Motion-Levels-Debug':'1'}}); await fetchState(); };
  document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

  function tileAt(event){ const element=document.elementFromPoint(event.clientX,event.clientY); return element?.closest?.('.tile')||null; }
  function sendPress(tile,pressed,keepalive=false){
    if(!tile||!state?.debug_controls_enabled||mode!=='live')return; const [x,y]=tile.dataset.key.split(',').map(Number);
    fetch('/press',{method:'POST',headers:{'Content-Type':'application/json','X-Motion-Levels-Debug':'1'},body:JSON.stringify({x,y,pressed}),keepalive}).catch(()=>{});
    tile.classList.toggle('pressed',pressed);
  }
  board.addEventListener('pointerdown',event=>{ const tile=tileAt(event); if(!tile||!state?.debug_controls_enabled||mode!=='live')return; event.preventDefault(); board.setPointerCapture(event.pointerId); activePointers.set(event.pointerId,tile.dataset.key); sendPress(tile,true); });
  board.addEventListener('pointermove',event=>{ if(!activePointers.has(event.pointerId))return; const tile=tileAt(event),previous=activePointers.get(event.pointerId),next=tile?.dataset.key; if(!next||next===previous)return; sendPress(tiles.get(previous),false); activePointers.set(event.pointerId,next); sendPress(tile,true); });
  function release(event){ const key=activePointers.get(event.pointerId); if(!key)return; sendPress(tiles.get(key),false); activePointers.delete(event.pointerId); if(board.hasPointerCapture(event.pointerId))board.releasePointerCapture(event.pointerId); }
  board.addEventListener('pointerup',release); board.addEventListener('pointercancel',release);
  function releaseAll(){ for(const key of activePointers.values())sendPress(tiles.get(key),false,true); activePointers.clear(); }
  // Renew the server-side safety lease while a pointer remains held. If the
  // browser disappears, the lease still expires and heals canonical pressure.
  setInterval(()=>{ for(const key of activePointers.values())sendPress(tiles.get(key),true); },500);
  addEventListener('blur',releaseAll); addEventListener('pagehide',releaseAll); document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
  orient(); addEventListener('resize',orient); connect(); fetchState();
</script>
</body>
</html>
