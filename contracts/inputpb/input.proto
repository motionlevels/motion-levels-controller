syntax = "proto3";

package motionlevels.engine.input.v1;

option go_package = "github.com/motionlevels/motion-levels-controller/contracts/inputpb";

message PressureEvent {
  uint64 sequence = 1;
  int64 unix_nanos = 2;
  uint32 x = 3;
  uint32 y = 4;
  bool pressed = 5;
  string source = 6;
  uint32 controller = 7;
  uint32 channel = 8;
  uint32 position = 9;
}
