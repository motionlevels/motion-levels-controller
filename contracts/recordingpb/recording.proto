syntax = "proto3";

package motionlevels.engine.recording.v1;

option go_package = "github.com/motionlevels/motion-levels-controller/contracts/recordingpb";

message FrameRecord {
  uint64 sequence = 1;
  int64 unix_nanos = 2;
  uint32 width = 3;
  uint32 height = 4;
  repeated TileState tiles = 5;
  string session_id = 6;
  uint64 game_frame_sequence = 7;
  int64 game_unix_nanos = 8;
  int64 controller_received_unix_nanos = 9;
  int64 controller_presented_unix_nanos = 10;
  string venue_session_id = 11;
}

message TileState {
  uint32 x = 1;
  uint32 y = 2;
  uint32 r = 3;
  uint32 g = 4;
  uint32 b = 5;
  bool pressed = 6;
}
