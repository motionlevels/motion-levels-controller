name: Container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: controller-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Validate deployment files
        run: |
          bash -n deploy/entrypoint.sh
          docker compose config --quiet

  publish:
    needs: validate
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/motionlevels/motion-levels-controller
          tags: type=sha,format=long

      - name: Build and publish pinned image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED_AT=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            CONTROLLER_PROTOCOL_VERSION=v1
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller
          provenance: mode=max
          sbom: true
