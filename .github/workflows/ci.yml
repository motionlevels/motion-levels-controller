name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: controller-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js for embedded dashboard validation
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate runtime and dashboard
        run: REQUIRE_NODE=1 make check

      - name: Run short parser and mapping fuzz campaigns
        run: make fuzz-short

      - name: Build pinned native artifact
        run: make native-build native-verify

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --requirement requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run embedded diagnostics browser smoke test
        run: make web-e2e

  nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate flake and NixOS module
        run: nix flake check --show-trace

      - name: Build Nix package
        run: nix build .#motion-levels-controller --print-build-logs
