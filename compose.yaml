name: motion-levels-controller

services:
  controller:
    image: ${CONTROLLER_IMAGE:-motion-levels-controller:local}
    build: .
    user: "10001:10001"
    init: true
    restart: unless-stopped
    network_mode: host
    volumes:
      - controller-state:/var/lib/motion-levels/floor-controller
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 128
    mem_limit: 256m

volumes:
  controller-state:
